# -----------------------------------------------------------------------------
#                        SLAM system definition for MOLA
#
# This file defines a MOLA system that:
#  - Reads the BotanicGarden dataset (https://github.com/robot-pesg/BotanicGarden)
#    ROS 1 ".bag" files (no ROS 1 installation required): the "LIO" sensors
#    bag and, optionally, the separate ground-truth poses bag, merged and
#    replayed jointly in time order.
#  - Shows the MOLA visualizer with the raw sensor streams.
#
# About the dataset:
#  - BotanicGarden bags carry NO /tf or /tf_static: all sensor extrinsics are
#    published instead as plain YAML matrices in
#    BotanicGarden/calib/extrinsics/calib_chain.yaml (see that repo's
#    AGENTS.md for a full write-up). The 'fixed_sensor_pose' entries below
#    were derived from that file, taking the Xsens MTi-680G IMU
#    (topic /imu/data) as the body/base_link frame:
#      - /velodyne_points : T_xsens_vlp16            (direct calibration)
#      - /livox/lidar     : T_xsens_vlp16 * T_vlp16_livox (cross-LiDAR calibration)
#      - /livox/imu       : T_xsens_gray0 * inv(T_bmi088_gray0) (via the camera chain;
#                            no direct bmi088<->xsens calibration is provided)
#  - The LIO bag's "/livox/lidar" topic is livox_ros_driver/CustomMsg
#    (Livox AVIA), supported via a dedicated converter (offset_time -> per-point
#    time, reflectivity -> intensity, line -> ring).
#  - Ground-truth poses (/gt_poses, geometry_msgs/PoseStamped) track the VLP16
#    frame, not the IMU/base_link: see the dataset's evaluation notes if you
#    need to align an estimated trajectory against the published GT.
#
# Example of usage:
#   BOTANICGARDEN_LIO_BAG=/path/to/1018_00_LIO.bag \
#   BOTANICGARDEN_GT_BAG=/path/to/gt_1018_00_qnew.bag \
#     mola-cli src/mola_input_rosbag1/mola-cli-launchs/rosbag1_botanicgarden.yaml
#
# Optional environment variables:
#   BOTANICGARDEN_LIO_BAG      (REQUIRED) path to the sensors (.bag) file.
#   BOTANICGARDEN_GT_BAG       (optional) path to the ground-truth-only (.bag)
#                              file. Leave unset to replay sensors only.
#   MOLA_PREVIEW_TOPIC         topic name of a 2D/3D sensor to preview in the GUI.
#   MOLA_DATASET_START_PAUSED  'true' to start paused (default: false).
# -----------------------------------------------------------------------------

modules:
  # =====================
  # MolaViz
  # =====================
  - name: viz
    type: ${MOLA_GUI_MODULE|mola::MolaVizImGui}
    enabled: ${MOLA_ROSBAG1_WITH_GUI|true} # Set MOLA_ROSBAG1_WITH_GUI to false if this file is used jointly to others with their own GUI modules.
    #verbosity_level: DEBUG
    params:
      imgui_app_name: rosbag1_botanicgarden

  # Offline or online sensory data source =====================
  - type: mola::Rosbag1Dataset
    name: rosbag1_input
    # This execution rate (Hz) determines the maximum rate of publishing
    # topics from the bag file. If a message in the bag has an actual rate
    # higher than this, the messages will be still sent out with the correct
    # timestamps, but physically in bursts.
    execution_rate: 50 # Hz
    #verbosity_level: DEBUG

    # Optional visualization of raw sensor streams in the MolaViz GUI.
    gui_preview_sensors:
      - raw_sensor_label: '/velodyne_points'
        decimation: 1
        win_pos: 5 5 400 400
      - raw_sensor_label: '/livox/lidar'
        decimation: 1
        win_pos: 5 5 400 400

    params:
      # One or more bag files, merged and replayed jointly in time order.
      # If BOTANICGARDEN_GT_BAG is unset, only the LIO sensors bag is used.
      rosbag_filename:
        - ${BOTANICGARDEN_LIO_BAG}
        - ${BOTANICGARDEN_GT_BAG|}

      # BotanicGarden has no /tf: all sensor poses below are given explicitly
      # as 'fixed_sensor_pose', wrt the Xsens IMU (/imu/data) as base_link.
      base_link_frame_id: xsens

      time_warp_scale: 1.0
      start_paused: ${MOLA_DATASET_START_PAUSED|false}

      # Pre-scan /gt_poses (if the GT bag was provided) into a full
      # trajectory, exposed via the MOLA OfflineDatasetSource ground-truth
      # API (hasGroundTruthTrajectory() / getGroundTruthTrajectory()), e.g.
      # for evo-style evaluation. This is independent of, and in addition to,
      # the per-timestep /gt_poses publishing declared under 'sensors' below.
      ground_truth_topic: /gt_poses

      sensors:
        - topic: /imu/data # Xsens MTi-680G, 400 Hz: this is the base_link itself
          type: CObservationIMU
          fixed_sensor_pose: "0 0 0 0 0 0"
          use_fixed_sensor_pose: true

        - topic: /velodyne_points # Velodyne VLP-16, 10 Hz
          type: CObservationPointCloud
          fixed_sensor_pose: "0.0584868 0.0084042 0.1689155 -1.448155 0.097462 0.444791" # T_xsens_vlp16
          use_fixed_sensor_pose: true

        - topic: /livox/lidar # Livox AVIA (livox_ros_driver/CustomMsg), 10 Hz
          type: CObservationPointCloud
          fixed_sensor_pose: "0.1369218 0.0011730 -0.0076735 -0.235134 -0.506113 -0.294598" # T_xsens_vlp16 * T_vlp16_livox
          use_fixed_sensor_pose: true

        - topic: /livox/imu # BMI088, Livox-built-in, 200 Hz
          type: CObservationIMU
          fixed_sensor_pose: "0.0850406 -0.0366670 0.0273713 -0.222559 0.317378 0.494650" # T_xsens_gray0 * inv(T_bmi088_gray0)
          use_fixed_sensor_pose: true

        - topic: /odom # Wheel odometry, 200 Hz
          type: CObservationOdometry

        - topic: /gt_poses # Ground-truth poses (only present if BOTANICGARDEN_GT_BAG is set)
          type: CObservationRobotPose
          sensorLabel: ground_truth
