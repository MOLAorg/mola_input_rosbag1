# -----------------------------------------------------------------------------
#                        SLAM system definition for MOLA
#
# This file defines a MOLA system that:
#  - Reads a ROS 1 ".bag" file (no ROS 1 installation required), and
#  - Shows the MOLA visualizer with the raw sensor streams.
#
# Example of usage:
#   ROSBAG1_FILE=/path/to/dataset.bag \
#     mola-cli src/mola_input_rosbag1/mola-cli-launchs/ros1bag_just_view.yaml
#
# Optional environment variables:
#   ROSBAG1_FILE         (REQUIRED) path to the input .bag file.
#   MOLA_PREVIEW_TOPIC   topic name of a 2D/3D sensor to preview in the GUI.
#   MOLA_DATASET_START_PAUSED  'true' to start paused (default: false).
# -----------------------------------------------------------------------------

modules:
  # =====================
  # MolaViz
  # =====================
  - name: viz
    type: ${MOLA_GUI_MODULE|mola::MolaVizImGui}
    enabled: ${MOLA_ROSBAG1_WITH_GUI|true} # Set MOLA_ROSBAG1_WITH_GUI to false if this file is used jointly to others with their own GUI modules.
    #verbosity_level: DEBUG
    params:
      imgui_app_name: rosbag1_lidar

  # Offline or online sensory data source =====================
  - type: mola::Rosbag1Dataset
    name: rosbag1_input
    # This execution rate (Hz) determines the maximum rate of publishing
    # topics from the bag file. If a message in the bag has an actual rate
    # higher than this, the messages will be still sent out with the correct
    # timestamps, but physically in bursts.
    execution_rate: 50 # Hz
    #verbosity_level: DEBUG

    # Optional visualization of raw sensor streams in the MolaViz GUI.
    # 'raw_sensor_label' must match a topic name present in the bag (which is
    # used as the default sensorLabel in the automatic-topic mode below).
    gui_preview_sensors:
      - raw_sensor_label: ${MOLA_PREVIEW_TOPIC|'/points'}
        decimation: 1
        win_pos: 5 5 400 400

    params:
      # We use an environment variable to force the user to specify a bag file:
      rosbag_filename: ${ROSBAG1_FILE}

      # The robot body frame. Sensor poses are looked up from /tf as the
      # transform base_link_frame_id -> sensor_frame_id.
      # (Set MOLA_BASE_LINK_FRAME to match your bag, e.g. 'r1/base_link'.)
      base_link_frame_id: ${MOLA_BASE_LINK_FRAME|base_link}

      time_warp_scale: 1.0
      start_paused: ${MOLA_DATASET_START_PAUSED|false}

      # If no 'sensors' entry is given, all ROS bag topics with a known mapping
      # to mrpt::obs classes will be automatically exposed to MOLA, using the
      # topic name as the sensorLabel. Supported message types:
      #   sensor_msgs/Imu, sensor_msgs/Image, sensor_msgs/PointCloud2,
      #   sensor_msgs/LaserScan, sensor_msgs/NavSatFix, nav_msgs/Odometry.
      #
      # Define 'sensors' explicitly if you want to override sensor poses (e.g.
      # if the bag has no /tf), pick specific topics, or remap message types
      # (e.g. read a PointCloud2 as a CObservationRotatingScan). Example:
      #
      #sensors:
      #  - topic: /points
      #    type: CObservationPointCloud
      #    # If present, this overrides whatever /tf says about the sensor pose:
      #    fixed_sensor_pose: "0 0 0 0 0 0"  # 'x y z yaw_deg pitch_deg roll_deg'
      #    use_fixed_sensor_pose: ${MOLA_USE_FIXED_SENSOR_POSE|false}
